[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes：未使用的匯入 / 變數
    "I",   # isort：匯入排序
    "B",   # flake8-bugbear：常見錯誤模式
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # 行長由 formatter 控制，中文註解容易誤判寬度
    "B008",  # FastAPI 的 Depends() 必須寫在預設值，這是框架慣例
]

[tool.ruff.lint.per-file-ignores]
# 測試裡為了聚焦而做的區域匯入是刻意的。
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 註：降低雜湊強度是由 tests/conftest.py 在匯入應用程式前設定環境變數完成。
# 這裡不用 pytest 的 env 選項——那需要額外安裝 pytest-env，
# 沒安裝時 pytest 只會發出「Unknown config option」警告而不會生效。
