name: CI

# 每次 push 與 PR 都跑，讓「測試是綠是紅」不必靠人記得執行。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pip-audit

      - name: 程式碼檢查
        working-directory: backend
        run: ruff check app tests scripts

      # 掃描相依套件的已知漏洞。
      # 用 continue-on-error：上游套件的修補不在我們控制範圍內，
      # 有漏洞時應該被看見，但不該讓整條 pipeline 卡住而擋掉其他修正。
      - name: 相依套件漏洞掃描
        working-directory: backend
        continue-on-error: true
        run: pip-audit -r requirements.txt

      # 測試不連外部服務：DB 用 SQLite in-memory、LLM 呼叫都被 mock，
      # 因此 CI 不需要 PostgreSQL 或 API key。
      - name: 執行測試
        working-directory: backend
        env:
          # 正式值 600,000 會讓每次建立測試帳號多花數百毫秒。
          PBKDF2_ITERATIONS: "1000"
          JWT_SECRET: "ci-only-not-a-real-secret"
        run: pytest -q --cov=app --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安裝套件
        working-directory: frontend
        run: npm ci

      - name: 程式碼檢查
        working-directory: frontend
        run: npm run lint

      - name: 執行測試
        working-directory: frontend
        run: npx vitest run

      - name: 建置
        working-directory: frontend
        run: npm run build

  system-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: system-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql://postgres:system-test-only@127.0.0.1:5432/postgres
      PYTHON_DOTENV_DISABLED: "1"
      GOOGLE_API_KEY: ""
      PBKDF2_ITERATIONS: "1000"
      JWT_SECRET: "isolated-system-tests-only-5948-not-for-production"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and browser dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint system tests
        working-directory: backend
        run: ruff check system_tests scripts/run_system_tests.py
      - name: PostgreSQL integration tests
        working-directory: backend
        run: python scripts/run_system_tests.py --suite postgres
      - name: Browser journeys against real API and PostgreSQL
        working-directory: backend
        run: python scripts/run_system_tests.py --suite e2e
      - name: Upload test results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-results
          include-hidden-files: true
          retention-days: 7
          path: |
            backend/.test-artifacts/*-results.xml
            backend/.test-artifacts/**/server.log
            backend/.test-artifacts/**/failure.png
            backend/.test-artifacts/**/trace.zip
